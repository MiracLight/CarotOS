<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Magaza simgesi: alisveris cantasi, icinde indirilen one cikan uygulama -->
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b190d"/>
      <stop offset="1" stop-color="#150b06"/>
    </linearGradient>
  </defs>
  <rect x="14" y="14" width="228" height="228" rx="48" fill="url(#zemin)"/>
  <!-- zemin cizgisi -->
  <line x1="52" y1="224" x2="204" y2="224" stroke="#ff9a3d" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"/>
  <!-- canta sapi -->
  <path d="M102 104 V86 a26 26 0 0 1 52 0 V104" fill="none" stroke="#ff9a3d" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
  <!-- canta govdesi -->
  <path d="M78 104 H178 L190 192 a12 12 0 0 1 -12 14 H78 a12 12 0 0 1 -12 -14 Z"
        fill="#ff9a3d" fill-opacity="0.1" stroke="#ff9a3d" stroke-opacity="0.9" stroke-width="6" stroke-linejoin="round"/>
  <!-- one cikan uygulama + indirme oku -->
  <rect x="100" y="130" width="56" height="56" rx="15" fill="#ff9a3d" fill-opacity="0.95"/>
  <path d="M128 146 V167 M118 158 L128 168 L138 158" fill="none" stroke="#1d0f07" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
