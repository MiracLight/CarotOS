# CarotOS CarotPot olay gunlugu. Satir bicimi:
#   2026-10-26 17:30:01 CAROTPOT kaynak=192.168.1.5 hizmet=ssh tur=giris | {...}
# Tuzaga dokunan her baglanti suphelidir; tum olay turleri sayilir.
[Definition]
failregex = ^\s*CAROTPOT kaynak=<HOST> hizmet=\S+ tur=\S+ \|
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
