# CarotOS ag gizliligi varsayilanlari (NetworkManager).
# Kafe, okul ya da otel gibi ortak aglarda cihazin donanim adresi (MAC) ve
# makine adi herkese gorunur; asagidaki ayarlar bunu azaltir. Bunlar yalnizca
# NetworkManager'in yonettigi baglantilarda gecerlidir ve profilde ayrica
# belirtilmemis degerlerin VARSAYILANIDIR (kullanici bir baglanti icin
# degistirebilir). Dosya /etc/NetworkManager/conf.d altindadir; NetworkManager
# paketinin kendi dosyalariyla cakismaz.

[connection]
# Donanim adresi (MAC): VARSAYILAN olarak gercek adres kullanilir; sahte adres her aga baglanmayi
# bozabilir (MAC filtreli okul/ofis aglari). Sahte ("stable": her ag icin farkli ama o agda hep ayni)
# adres Karsilama > Ag ve gizlilik anahtariyla acilir; anahtar 91-carotos-mac.conf dosyasini yazar.

# DHCP istegine makine adini ("carotos") ekleme: aga katilirken adin
# yayinlanmasin.
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false

# IPv6 gizlilik uzantilari: giden baglantilarda donanim adresinden uretilen
# kalici adres yerine gecici adres tercih edilir (2 = etkin ve tercihli).
ipv6.ip6-privacy=2

[device]
# Wi-Fi taramasi sirasinda rastgele MAC kullan (NetworkManager'in zaten
# varsayilani; belgelenmis ve degismez olsun diye acikca yazildi).
wifi.scan-rand-mac-address=yes
