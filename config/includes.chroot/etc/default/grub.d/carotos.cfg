# CarotOS: kurulu sistemin onyukleme ayarlari.
# Kurucu preseed'deki debian-installer/add-kernel-opts degerini okuyor
# (/var/log/installer/cdebconf/questions.dat'ta gorunuyor) ama GRUB'a yazmiyor;
# bu yuzden ayar burada verilir. update-grub bu dizindeki .cfg dosyalarini
# /etc/default/grub'dan sonra okur, yani buradaki deger kurucununkini ezer.
# NOT: /etc/default/grub ISO'ya KONMAZ. O dosya grub paketinin yapilandirma
# dosyasidir (ucf); biz koyarsak kurucu grub paketini kurarken "yerel degisiklik
# var, ne yapayim?" diye sorar ve her grub guncellemesinde kullanici ayni soruyu
# gorur. Butun CarotOS ayarlari bu parcada tutulur.
#
# Gorunum Debian'in kendi GRUB temasidir; ozel GRUB temasi yoktur (karar 7 Kasim).
#
# quiet splash: Plymouth acilis ekrani (CarotOS temasi, bkz. usr/share/plymouth/themes/carotos).
# loglevel=3 quiet'ten SONRA gelmeli (quiet konsol seviyesini 4'e ceker).
# systemd.show_status=error: basarili adimlar ([ OK ] Started ...) gizlenir, hata olursa gorunur
#   ("false" olsaydi basarisiz bir servis de gorunmezdi). Ayni ayar etc/systemd/system.conf.d'de de var.
# noresume: diskte swap yok (zram kullaniliyor); "Gave up waiting for suspend/resume device" beklemesi kalkar.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 systemd.show_status=error vt.global_cursor_default=0 noresume"

# Menu bekleme suresi: etc/grub.d/99_carotos_sure yalniz CarotOS varsa 5 sn, baska isletim sistemi
# bulunursa 30 sn yapar (os-prober'a bakar). Buradaki 5 yedek degerdir.
GRUB_TIMEOUT_STYLE="menu"
GRUB_TIMEOUT="5"

# Debian 12'den beri varsayilan kapali: Windows ve baska Linux'lar menude gorunsun.
GRUB_DISABLE_OS_PROBER=false

# Menu girisleri "Debian GNU/Linux" degil dagitimin adini (CarotOS) tasisin.
GRUB_DISTRIBUTOR=`( . /etc/os-release && echo ${NAME} )`
