# CarotOS: kurulu sistemde acilis mesajlarini azalt.
# Kurucu preseed'deki debian-installer/add-kernel-opts degerini okuyor
# (/var/log/installer/cdebconf/questions.dat'ta gorunuyor) ama GRUB'a yazmiyor;
# bu yuzden ayar burada verilir. update-grub bu dizindeki .cfg dosyalarini
# /etc/default/grub'dan sonra okur, yani buradaki deger kurucununkini ezer.
# NOT: /etc/default/grub ISO'ya KONMAZ. O dosya grub paketinin yapilandirma
# dosyasidir (ucf); biz koyarsak kurucu grub paketini kurarken "yerel degisiklik
# var, ne yapayim?" diye sorar ve her grub guncellemesinde kullanici ayni soruyu
# gorur. Butun CarotOS ayarlari bu parcada tutulur.
#
# systemd.show_status=auto: "quiet" varken basarili adimlar gizlenir, hata
# olursa gosterilir (false olsaydi basarisiz bir servis de gorunmezdi).
GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=3 systemd.show_status=auto"

# Menu girisleri "Debian GNU/Linux" degil dagitimin adini (CarotOS) tasisin.
GRUB_DISTRIBUTOR=`( . /etc/os-release && echo ${NAME} )`
