# CarotOS 1.4: sources-media-unmount'tan sonra, umount'tan once (hedef sistemde calisir).
# Geri koyma adimlari basarisiz olursa kurulum durur (kaynaklar/kanca kaybolmasin);
# temizlik adimlari "-" onekiyle hata vermez. Mutlak yollar, kullanici girdisi yok.
---
dontChroot: false
timeout: 60
script:
    - command: "mv /var/lib/carotos-kurulum/debian.sources /etc/apt/sources.list.d/debian.sources"
    - command: "mv /var/lib/carotos-kurulum/carotos.sources /etc/apt/sources.list.d/carotos.sources"
    - command: "mv /var/lib/carotos-kurulum/50carotos-kurtarma /etc/apt/apt.conf.d/50carotos-kurtarma"
    - command: "rm -rf /var/lib/carotos-kurulum"
    # Cift kaynak tanimi olmasin (deb822 geri geldi)
    - command: "-test ! -f /etc/apt/sources.list.d/debian.sources || rm -f /etc/apt/sources.list"
    # Canliya ozgu kalintilar (live-config kaldirildi; /etc/live yalniz bizim config.conf.d)
    - command: "-rm -rf /etc/live"
    # Calamares kaldirildi: baslaticilar, ayarlar ve simge kurulu sistemde kalmasin
    - command: "-rm -rf /etc/calamares"
    - command: "-rm -f /usr/bin/carotos-kur /usr/bin/carotos-kur-simge /usr/share/applications/carotos-kur.desktop /etc/xdg/autostart/carotos-kur-simge.desktop"
    - command: "-rm -f /usr/share/icons/hicolor/16x16/apps/carotos-kur.png /usr/share/icons/hicolor/22x22/apps/carotos-kur.png /usr/share/icons/hicolor/24x24/apps/carotos-kur.png /usr/share/icons/hicolor/32x32/apps/carotos-kur.png /usr/share/icons/hicolor/48x48/apps/carotos-kur.png /usr/share/icons/hicolor/64x64/apps/carotos-kur.png /usr/share/icons/hicolor/128x128/apps/carotos-kur.png /usr/share/icons/hicolor/256x256/apps/carotos-kur.png"
