# CarotOS 1.4: karsilama sayfasi. Gereksinimler Debian degerleri; internet zorunlu degil
# (ISO'dan cevrimdisi kurulum desteklenir).
---
showSupportUrl: true
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
    requiredStorage: 15.0
    requiredRam: 1.0
    internetCheckUrl: https://carotos.org
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root

geoip:
    style: "none"
