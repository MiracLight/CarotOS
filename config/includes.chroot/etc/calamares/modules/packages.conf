# CarotOS 1.4: kurulumdan sonra hedef sistemden canliya ozgu paketleri kaldir.
# Yalniz imajda GERCEKTEN kurulu paketler "remove"da; emin olunmayanlar "try_remove"da
# (apt remove bilinmeyen paket adinda hata verir; Debian listesindeki *-doc ve live-task-*
# bizim imajda yoktur). sudo ve CarotOS uygulamalari ASLA listeye girmez.
---
backend: apt

# Cevrimdisi kurulumda ag beklenmesin
update_db: false
update_system: false

# autoremove kapali: live-config'in cektigi sudo vb. paketler silinmesin
autoremove: false

operations:
    - remove:
        - live-boot
        - live-config
        - live-config-systemd
        - calamares
        - calamares-settings-debian
    - try_remove:
        - live-boot-initramfs-tools
        - live-tools
        - live-boot-doc
        - live-config-doc
        - live-task-localisation
        - live-task-recommended
