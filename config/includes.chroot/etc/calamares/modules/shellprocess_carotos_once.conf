# CarotOS 1.4: unpackfs'ten sonra, sources-media'dan once (hedef sistemde calisir).
# Mutlak yollar, kullanici girdisi yok. "-" oneki YOK: herhangi biri basarisiz olursa kurulum durur.
---
dontChroot: false
timeout: 60
script:
    # Kurtarma apt kancasi (DPkg::Pre-Invoke) kurulum sirasinda nokta acmaya calismasin
    - command: "mkdir -p /var/lib/carotos-kurulum"
    - command: "mv /etc/apt/apt.conf.d/50carotos-kurtarma /var/lib/carotos-kurulum/50carotos-kurtarma"
    # sources-media yalniz base.list'i siler; deb822 kaynaklari cevrimdisi apt-get update'i bekletir
    - command: "mv /etc/apt/sources.list.d/debian.sources /var/lib/carotos-kurulum/debian.sources"
    - command: "mv /etc/apt/sources.list.d/carotos.sources /var/lib/carotos-kurulum/carotos.sources"
