# CarotOS 1.4: kullanici ayarlari. Root hesabi kilitli, ilk kullanici sudo grubunda
# (preseed.cfg passwd/root-login false ile ayni davranis).
---
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
# wireshark grubunu carotos-firstboot.sh ilk acilista ekler.

autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
setRootPassword: false

passwordRequirements:
    minLength: 8
    maxLength: -1
    libpwquality:
        - minlen=8
        - minclass=2
allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root ]

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "carotos"
    forbidden_names: [ localhost ]
