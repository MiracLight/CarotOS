# CarotOS 1.4: GRUB (BIOS + UEFI). Ayrintilar: BUILD.md "Calamares (canlidan kurulum)".
---
efiBootLoader: "grub"
timeout: "10"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# ZORUNLU "debian": Debian'in imzali grubx64.efi dosyasina "debian" dizini gomuludur; baska ad
# (ornegin branding bootloaderEntryName "CarotOS") Secure Boot'ta GRUB istemine dusurur.
# d-i de EFI/debian kullanir. NVRAM menusunde "debian" gorunmesi kacinilmazdir.
efiBootloaderId: "debian"

# TEST GEREKIR: VM'de true ve false iki ayri kurulumla denenmeli (docs/CALAMARES_ARASTIRMA.md,
# Test plani 4). Secure Boot'ta EFI/BOOT/BOOTX64.EFI olarak GRUB kopyalanirsa reddedilebilir;
# dogru zincir shimx64.efi'yi BOOTX64.EFI yapmaktir. Simdilik false.
installEFIFallback: false
