# CarotOS 1.4: bolumleme. trixie'nin calamares-settings-debian'i partition.conf gondermez;
# forky'nin LUKS2 ayari GRUB isteminde kalir, bu yuzden LUKS1 sabitlenir.
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: EFI

# Takas: disk kucuk olabilir (en az 15 GB), RAM icin zram var; baslangicta kucuk takas bolumu.
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: small
swapPartitionName: swap

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: true
initialPartitioningChoice: erase

defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]

# Sifreli disk: GRUB LUKS2'yi yeterince desteklemez (Debian-live listesi, Eylul 2025)
enableLuksAutomatedPartitioning: true
luksGeneration: luks1

lvm:
    enable: false
