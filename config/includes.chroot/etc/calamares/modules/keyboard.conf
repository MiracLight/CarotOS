# CarotOS 1.4: klavye adimi (Calamares 3.3 keyboard modulu). Klavye duzeni YALNIZ burada secilir;
# Karsilama klavyeye dokunmaz. Secilen duzen ve varyant (orn. Turkce F) kurulum sirasinda canli
# oturuma uygulanir (kullanici adi/parola dogru yazilsin) ve kurulu sisteme yazilir:
#   /etc/default/keyboard (konsol, Debian) + /etc/X11/xorg.conf.d/00-keyboard.conf (Xfce/X oturumu)
# Onizleme icin ckbcomp gerekir: Debian'da keyboard-configuration paketindedir
# (config/package-lists/calamares.list.chroot).
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"

# Debian'da vconsole.conf kullanilmaz; konsol duzeni /etc/default/keyboard'dan gelir
convertedKeymapPath: ""

writeEtcDefaultKeyboard: true

# Xfce X11'de calisir: dosyalar dogrudan yazilir (locale1 servisi gerekmez)
useLocale1: false

# Varsayilan duzen kurulumda secilen dilden tahmin edilir (Turkce -> Turkce Q); kullanici degistirebilir
guessLayout: true

configure:
    kwin: false
