# CarotOS 1.4 Calamares ayarlari (Debian 13 calamares-settings-debian 13.0.13-1 temel alindi).
# Farklar: branding carotos; sources-final YOK (CarotOS apt kaynaklari deb822 debian.sources +
# carotos.sources'tur, sources-final /etc/apt/sources.list yazip backports ekler);
# shellprocess@carotos_once / shellprocess@carotos_sonra eklendi (docs/CALAMARES_ARASTIRMA.md, Dizi).
---
# Debian modulleri (dpkg-unsafe-io, sources-media, bootloader-config ...) /usr/lib/calamares/modules'tadir
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       carotos_once
  module:   shellprocess
  config:   shellprocess_carotos_once.conf
- id:       carotos_sonra
  module:   shellprocess
  config:   shellprocess_carotos_sonra.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - shellprocess@carotos_once
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - shellprocess@carotos_sonra
  - umount
- show:
  - finished

branding: carotos

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
