# CarotOS ag gizliligi: IPv6 gecici (gizlilik) adresleri.
# NetworkManager baglantilari bunu kendi ayarindan (conf.d/90-carotos-gizlilik.conf)
# alir; bu dosya NetworkManager disinda yonetilen arayuzler (ifupdown vb.) icindir.
# 2 = gecici adresleri uret ve giden baglantilarda onlari tercih et.
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2
