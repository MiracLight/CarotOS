# CarotOS: RAM'de sikistirilmis takas (zram).
# systemd-zram-generator paketi /dev/zram0 aygitini zaten etkinlestirir
# (/usr/lib/systemd/zram-generator.conf, RAM'in yarisi ya da 4 GiB, hangisi
# kucukse); bu parca yalnizca ayarlari belirler. zram kullanilan sayfalar
# RAM'de sikistirilir, diske yazilmaz. Oncelik (100) disk takasindan (negatif)
# yuksek oldugu icin once zram dolar. Disk takas alani (kurucu olusturduysa)
# zram dolunca yedek olarak kalir; yani "RAM hic diske yazilmaz" garantisi
# YOKTUR, yalnizca yazilma ihtimali azalir.
# Dosya adi 90- ile baslar: paketin varsayilanini ezer (bkz. zram-generator.conf(5)).
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
