# CarotOS 1.0 "Eggshell" — debian-installer on-yapilandirmasi
#
# Root hesabi olusturulmaz. Bu durumda debian-installer'in user-setup
# bileseni ilk normal kullaniciyi otomatik olarak sudo grubuna ekler.
# (Ubuntu ve Kali de ayni modeli kullanir.)
#
# SONUC: kurulumda root parolasi SORULMAZ, root hesabi kilitlidir.
#        Yonetici islemleri icin "sudo" veya "sudo -i" kullanilir.
#        "su -" ARTIK CALISMAZ.
#
# Root parolasi sorulmasini istersen asagidaki satirin basina # koy.

d-i passwd/root-login boolean false
