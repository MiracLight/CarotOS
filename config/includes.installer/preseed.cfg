# CarotOS 1.3 "Eggshell" — debian-installer on-yapilandirmasi
#
# Root hesabi olusturulmaz. Bu durumda debian-installer'in user-setup
# bileseni ilk normal kullaniciyi otomatik olarak sudo grubuna ekler.
# (Ubuntu ve Kali de ayni modeli kullanir.)
#
# SONUC: kurulumda root parolasi SORULMAZ, root hesabi kilitlidir.
#        Yonetici islemleri icin "sudo" veya "sudo -i" kullanilir.
#        "su -" ARTIK CALISMAZ.
#
# Root parolasi sorulmasini istersen asagidaki satirin basina # koy.

d-i passwd/root-login boolean false

# Kurulu sistemde acilis mesajlarini (cekirdek ve systemd durum satirlari)
# gizle. Hata olursa yine gosterilir.
# NOT: Kurucu bu degeri okuyor ama GRUB'a yazmiyor; asil ayar
# /etc/default/grub.d/carotos.cfg dosyasindadir (ikisi ayni tutulur).
d-i debian-installer/add-kernel-opts string loglevel=3 systemd.show_status=error

# Kurulu sistemin bilgisayar adi: kurulumda SORULUR, onerilen deger carotos
# (user@carotos). Onceden cevaplanan sorular kurucuda gosterilmez; 'seen false'
# cevabi varsayilan olarak birakip soruyu yine de gosterir. netcfg/hostname
# kullanilmaz: o, soruyu atlatip adi zorlar.
d-i netcfg/get_hostname string carotos
d-i netcfg/get_hostname seen false
